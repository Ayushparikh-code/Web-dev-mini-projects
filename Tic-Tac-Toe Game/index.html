<!DOCTYPE html>
<html lang="en" oncontextmenu="return false">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <title>Tic-Tac-Toe</title>
</head>

<body>
  <!--Dark mode button-->
  <div class="container">
    <div class="toggle-btn" id="icon" onclick="this.classList.toggle('active')">
      <div class="inner-circle"></div>
    </div>
  </div>

  <!--select-box section-->
  <div class="select-box" role="dialog" aria-label="Choose player">
    <header>Tic Tac Toe</header>
    <div class="content">
      <div class="title">Select which player you want to be?</div>
      <div class="options">
        <button class="playerX" aria-pressed="false">Player (X)</button>
        <button class="playerO" aria-pressed="false">Player (O)</button>
      </div>
    </div>
  </div>

  <!--Playboard section-->
  <div class="play-board" aria-live="polite">
    <div class="details">
      <div class="players">
        <span class="Xturn">X's turn</span>
        <span class="Oturn">O's turn</span>
        <div class="slider"></div>
      </div>
    </div>

    <div class="play-area">
      <section>
        <span class="box1" role="button" tabindex="0" aria-label="cell 1"></span>
        <span class="box2" role="button" tabindex="0" aria-label="cell 2"></span>
        <span class="box3" role="button" tabindex="0" aria-label="cell 3"></span>
      </section>
      <section>
        <span class="box4" role="button" tabindex="0" aria-label="cell 4"></span>
        <span class="box5" role="button" tabindex="0" aria-label="cell 5"></span>
        <span class="box6" role="button" tabindex="0" aria-label="cell 6"></span>
      </section>
      <section>
        <span class="box7" role="button" tabindex="0" aria-label="cell 7"></span>
        <span class="box8" role="button" tabindex="0" aria-label="cell 8"></span>
        <span class="box9" role="button" tabindex="0" aria-label="cell 9"></span>
      </section>
    </div>
  </div>

  <!--Result box (updated: Replay + Main Menu) -->
  <div class="result-box" role="status" aria-live="assertive">
    <div class="won-text"></div>
    <div class="btn">
      <button class="replay-btn" type="button">Replay</button>
      <button class="mainmenu-btn" type="button">Main Menu</button>
    </div>
  </div>

  <div class="footer">
    <h4>Designed &amp; Developed with &#10084;&#65039; by Atif</h4>
  </div>

  <script>
    var icon = document.getElementById("icon");
    icon.onclick = function () {
      document.body.classList.toggle("dark-theme");
      if (document.body.classList.contains("dark-theme")) {
        icon.classList.add("active");
      } else {
        icon.classList.remove("active");
      }
    };
  </script>

  <script src="script.js"></script>
</body>

</html>
