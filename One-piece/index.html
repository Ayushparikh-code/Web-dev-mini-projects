<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>One Piece Logo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="onepiece">ONE PIECE</h1>
  <div class="logo">
    <div class="circle1"></div>
    <div class="circle11"></div>
    <div class="circle2"></div>
    <div class="circle22"></div>
    <div class="circle3"></div>
    <div class="circle33"></div>
    <div class="circle4"></div>
    <div class="circle44"></div>

    <div class="crossbone">
    </div>
    <div class="crossbone second"></div>
    <div class="hat"></div>
    <div class="hat-band"></div>
    <div class="hat-brim"></div>
    <div class="skull">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
    </div>
    <div class="teeth">
        <div class="teethtable">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
        <div class="teethbottom"></div>
    </div>
  </div>
</body>
</html>
